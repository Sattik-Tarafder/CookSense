name: Compile Check

on:
  push:
    branches: [ "main", "1.21.1" ]
  pull_request:
    branches: [ "main", "1.21.1" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Verify Build
        run: ./gradlew build
